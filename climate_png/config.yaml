name: Climate PNG
version: "1.0.4"
slug: climate_png
description: Renders the Climate house card as /config/www/climate.png (for a camera / Android widget)
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
options:
  interval: 300
  width: 1440
schema:
  interval: int(30,3600)
  width: int(360,3000)